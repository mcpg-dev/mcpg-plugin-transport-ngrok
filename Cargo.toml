[package]
name = "mcpg-plugin-transport-ngrok"
version = "0.1.0-rc.4"
license = "Apache-2.0"
edition = "2024"
description = "ngrok transport plugin (dev.mcpg.transport.ngrok): serves the gateway at an ngrok endpoint with no inbound port"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["cdylib-export"]
# Gates the `mcpg_plugin_register` export, so the crate can also link as an
# rlib (its own tests) without a duplicate symbol.
cdylib-export = []
# Declared so `declare_plugin!`'s `register_static` gate does not trigger
# `unexpected_cfgs`. Empty: `transport` has no static-firstparty path.
static-firstparty = []

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-rc.8", version = "=0.1.0-rc.8" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-rc.13", version = "=0.1.0-rc.13" }
mcpg-plugin-http-ingress = { git = "https://github.com/mcpg-dev/mcpg-plugin-http-ingress", tag = "v0.1.0-rc.2", version = "=0.1.0-rc.2" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ngrok = { version = "=0.19.0", default-features = false, features = ["aws-lc-rs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
