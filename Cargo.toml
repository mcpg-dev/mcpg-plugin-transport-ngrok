[package]
name = "mcpg-plugin-transport-ngrok"
version = "0.1.0-rc.2"
license = "Apache-2.0"
edition = "2024"
description = "ngrok transport plugin (dev.mcpg.transport.ngrok): serves the gateway at an ngrok endpoint with no inbound port"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["cdylib-export"]
# Gates the `mcpg_plugin_register` export, so the crate can also link as an
# rlib (its own tests) without a duplicate symbol.
cdylib-export = []
# Declared so `declare_plugin!`'s `register_static` gate does not trigger
# `unexpected_cfgs`. Empty: `transport` has no static-firstparty path.
static-firstparty = []

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-rc.6", version = "=0.1.0-rc.6" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-rc.11", version = "=0.1.0-rc.11" }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
ngrok = { version = "=0.19.0", default-features = false, features = ["aws-lc-rs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
hyper = { version = "1", features = ["client", "http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync", "io-util"] }
